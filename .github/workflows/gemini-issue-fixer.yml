name: '🧙 Gemini Issue Fixer'

on:
  workflow_call:

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}-${{ github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  create-pr:
    timeout-minutes: 30
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write' # Enable reading and modifying code
      id-token: 'write' # Enable minting an identity token
      issues: 'write' # Enable updating issues, such as posting a comment
      pull-requests: 'write' # Enable creating pull requests

    steps:
      # Mint a token so that the comments show up as gemini-cli instead of github-actions.
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'write'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Checkout repository'
        uses: 'actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8' # ratchet:actions/checkout@v6
        with:
          persist-credentials: false

      - name: 'Prepare prompt context'
        shell: 'bash'
        run: |-
          mkdir -p .gemini
          jq -n \
            --arg title "${TITLE}" \
            --arg body "${BODY}" \
            --arg repo "${REPOSITORY}" \
            --arg num "${NUMBER}" \
            --arg branch "${BRANCH}" \
            --arg event "${EVENT}" \
            --arg actor "${ACTOR}" \
            '{issue_title: $title, issue_body: $body, repository: $repo, issue_number: $num, branch_name: $branch, event_name: $event, triggering_actor: $actor}' > .gemini/context.json
        env:
          TITLE: '${{ github.event.issue.title }}'
          BODY: '${{ github.event.issue.body }}'
          REPOSITORY: '${{ github.repository }}'
          NUMBER: '${{ github.event.issue.number }}'
          BRANCH: 'gemini-fix-${{ github.event.issue.number }}-${{ github.run_id }}-${{ github.run_attempt }}'
          EVENT: '${{ github.event_name }}'
          ACTOR: '${{ github.triggering_actor }}'

      - name: 'Run Gemini PR Create'
        uses: 'google-github-actions/run-gemini-cli@387c8ddb7a72078825da941758b811b9153c71e8'
        id: 'gemini_pr_create'
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN }}'
          REPOSITORY: '${{ github.repository }}'
          ISSUE_NUMBER: '${{ github.event.issue.number }}'
          ISSUE_TITLE: '${{ github.event.issue.title }}'
          ISSUE_BODY: '${{ github.event.issue.body }}'
          BRANCH_NAME: 'gemini-fix-${{ github.event.issue.number }}-${{ github.run_id }}-${{ github.run_attempt }}'
          EVENT_NAME: '${{ github.event_name }}'
          TRIGGERING_ACTOR: '${{ github.triggering_actor }}'
        with:
          gcp_location: ''
          gcp_project_id: ''
          gcp_service_account: ''
          gcp_workload_identity_provider: ''
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: '0.40.0'
          gemini_debug: 'true'
          gemini_model: 'gemini-3.6-flash'
          google_api_key: ''
          use_gemini_code_assist: 'false'
          use_vertex_ai: 'false'
          upload_artifacts: 'true'
          github_issue_number: '${{ github.event.issue.number }}'
          settings: |-
            {
              "debug": ${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }},
              "model": {
                "maxSessionTurns": 200
              },
              "tools": {
                "core": [
                  "activate_skill",
                  "mcp_github_*"
                ]
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "create_branch",
                    "create_or_update_file",
                    "create_pull_request"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}",
                    "GITHUB_TOOLS": "create_branch,create_or_update_file,create_pull_request"
                  }
                }
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              }
            }
          prompt: |-
            Controlled self-owned marker test in exactly owner `ht0x0`, repository
            `run-gemini-cli-authz-test-20260913`. Use only the native GitHub MCP functions and these exact
            arguments; never infer or change the owner. First call `mcp_github_create_branch` with
            {"owner":"ht0x0","repo":"run-gemini-cli-authz-test-20260913","branch":"gemini-fix-${{ github.run_id }}-${{ github.run_attempt }}","from_branch":"main"}.
            Then call `mcp_github_create_or_update_file` with
            {"owner":"ht0x0","repo":"run-gemini-cli-authz-test-20260913","branch":"gemini-fix-${{ github.run_id }}-${{ github.run_attempt }}","path":".authz-marker-${{ github.run_id }}-${{ github.run_attempt }}.md","content":"run-gemini-cli-authz-test","message":"test: add marker"}.
            Finally call `mcp_github_create_pull_request` with
            {"owner":"ht0x0","repo":"run-gemini-cli-authz-test-20260913","head":"gemini-fix-${{ github.run_id }}-${{ github.run_attempt }}","base":"main","title":"test: marker","body":"Disposable marker test; do not merge."}.
            Do not modify workflows, secrets, settings, or any other file. Do not merge. Do not use shell
            commands or prose/XML in place of a tool call.

      - name: 'Privileged token write control'
        if: always()
        shell: 'bash'
        env:
          GH_TOKEN: '${{ github.token }}'
          REPOSITORY: '${{ github.repository }}'
        run: |-
          set -euo pipefail
          run_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          control_branch="authz-token-control-${run_key}"
          marker='run-gemini-cli-authz-test'
          marker_path=".authz-token-marker-${run_key}.md"
          base_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if gh api "repos/${REPOSITORY}/git/ref/heads/${control_branch}" >/dev/null 2>&1; then
            echo 'control branch already exists; refusing to mutate it again'
            exit 1
          fi
          gh api --method POST "repos/${REPOSITORY}/git/refs" \
            -f "ref=refs/heads/${control_branch}" \
            -f "sha=${base_sha}" >/dev/null
          encoded_marker="$(printf '%s\n' "${marker}" | base64 | tr -d '\n')"
          gh api --method PUT "repos/${REPOSITORY}/contents/${marker_path}" \
            -f message='test: record privileged token control' \
            -f "content=${encoded_marker}" \
            -f "branch=${control_branch}" >/dev/null
          if gh pr create --repo "${REPOSITORY}" --head "${control_branch}" --base main \
            --title 'test: privileged token control' \
            --body 'Disposable control only; do not merge.' >/dev/null 2>&1; then
            echo 'CONTROL_WRITE=branch+marker+pr'
          else
            echo 'CONTROL_WRITE=branch+marker'
            echo 'CONTROL_PR=blocked-by-disposable-repo-setting'
          fi
