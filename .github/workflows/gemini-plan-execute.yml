name: '🧙 Gemini Plan Execution'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

concurrency:
  group: '${{ github.workflow }}-plan-execute-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  plan-execute:
    timeout-minutes: 30
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'

    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'write'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Checkout Code'
        uses: 'actions/checkout@v4' # ratchet:exclude
        with:
          persist-credentials: false

      - name: 'Prepare prompt context'
        shell: 'bash'
        run: |-
          mkdir -p .gemini
          jq -n \
            --arg title "${TITLE}" \
            --arg desc "${DESCRIPTION}" \
            --arg event "${EVENT_NAME}" \
            --arg pr "${IS_PULL_REQUEST}" \
            --arg num "${ISSUE_NUMBER}" \
            --arg repo "${REPOSITORY}" \
            --arg context "${ADDITIONAL_CONTEXT}" \
            '{title: $title, description: $desc, event_name: $event, is_pull_request: $pr, issue_number: $num, repository: $repo, additional_context: $context}' > .gemini/context.json
        env:
          TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
          DESCRIPTION: '${{ github.event.pull_request.body || github.event.issue.body }}'
          EVENT_NAME: '${{ github.event_name }}'
          IS_PULL_REQUEST: '${{ !!github.event.pull_request }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'

      - name: 'Run Gemini CLI'
        id: 'run_gemini'
        uses: 'google-github-actions/run-gemini-cli@387c8ddb7a72078825da941758b811b9153c71e8'
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
          DESCRIPTION: '${{ github.event.pull_request.body || github.event.issue.body }}'
          EVENT_NAME: '${{ github.event_name }}'
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          IS_PULL_REQUEST: '${{ !!github.event.pull_request }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'
        with:
          gcp_location: ''
          gcp_project_id: ''
          gcp_service_account: ''
          gcp_workload_identity_provider: ''
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: '0.57.0'
          gemini_debug: 'false'
          gemini_model: ''
          google_api_key: ''
          use_gemini_code_assist: 'false'
          use_vertex_ai: 'false'
          upload_artifacts: 'false'
          workflow_name: 'gemini-plan-execute'
          github_pr_number: '${{ github.event.pull_request.number }}'
          github_issue_number: '${{ github.event.issue.number }}'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "add_issue_comment",
                    "issue_read",
                    "list_issues",
                    "search_issues",
                    "create_pull_request",
                    "pull_request_read",
                    "list_pull_requests",
                    "search_pull_requests",
                    "create_branch",
                    "create_or_update_file",
                    "delete_file",
                    "fork_repository",
                    "get_commit",
                    "get_file_contents",
                    "list_commits",
                    "push_files",
                    "search_code"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": []
              }
            }
          prompt: '/gemini-plan-execute'

      - name: 'Privileged MCP token control'
        if: always()
        shell: 'bash'
        env:
          GH_TOKEN: '${{ github.token }}'
          REPOSITORY: '${{ github.repository }}'
        run: |-
          set -euo pipefail
          run_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          control_branch="authz-approve-token-control-${run_key}"
          repo_name="${REPOSITORY#*/}"
          marker='run-gemini-cli-approve-mcp-control'
          marker_path=".authz-approve-token-marker-${run_key}.md"
          if gh api "repos/${REPOSITORY}/git/ref/heads/${control_branch}" >/dev/null 2>&1; then
            echo 'control branch already exists; refusing to mutate it again'
            exit 1
          fi
          {
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"authz-control","version":"1.0"}}}'
            printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}'
            printf '%s\n' "{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/call\",\"params\":{\"name\":\"create_branch\",\"arguments\":{\"owner\":\"${REPOSITORY%%/*}\",\"repo\":\"${repo_name}\",\"branch\":\"${control_branch}\",\"from_branch\":\"main\"}}}"
            printf '%s\n' "{\"jsonrpc\":\"2.0\",\"id\":3,\"method\":\"tools/call\",\"params\":{\"name\":\"create_or_update_file\",\"arguments\":{\"owner\":\"${REPOSITORY%%/*}\",\"repo\":\"${repo_name}\",\"path\":\"${marker_path}\",\"content\":\"${marker}\",\"message\":\"test: record approve MCP token control\",\"branch\":\"${control_branch}\"}}}"
            sleep 1
          } | docker run --rm -i -e GITHUB_PERSONAL_ACCESS_TOKEN="${GH_TOKEN}" ghcr.io/github/github-mcp-server:v0.27.0 2>/dev/null | tee mcp-control.log >/dev/null
          if ! gh api "repos/${REPOSITORY}/contents/${marker_path}?ref=${control_branch}" >/dev/null 2>&1; then
            encoded_marker="$(printf '%s\n' "${marker}" | base64 | tr -d '\n')"
            gh api --method PUT "repos/${REPOSITORY}/contents/${marker_path}" \
              -f message='test: record approve token control' \
              -f "content=${encoded_marker}" \
              -f "branch=${control_branch}" >/dev/null
          fi
          gh api "repos/${REPOSITORY}/contents/${marker_path}?ref=${control_branch}" >/dev/null
          echo 'CONTROL_TOKEN_WRITE=branch+marker'
