name: issue-comment token control

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  control:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.sender.type == 'User' &&
      startsWith(github.event.comment.body, '@gemini-cli') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default issue-comment ref
        uses: actions/checkout@v4
      - name: Record event boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "EVENT_NAME=${GITHUB_EVENT_NAME}"
          echo "EVENT_ACTION=${{ github.event.action }}"
          echo "COMMENTER_ASSOCIATION=${{ github.event.comment.author_association }}"
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          echo "CHECKED_OUT_BRANCH=$(git branch --show-current)"
          echo "BASE_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          pr_url='${{ github.event.issue.pull_request.url }}'
          gh api "$pr_url" --jq '"PR_HEAD_SHA=" + .head.sha + " PR_HEAD_REPO=" + .head.repo.full_name + " PR_HEAD_FORK=" + (.head.repo.fork|tostring)'
      - name: Prove base contents write
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          branch="issue-comment-token-control-${run_key}"
          marker_path=".authz-issue-comment-token-marker-${run_key}.md"
          marker='run-gemini-cli-issue-comment-token-control'
          base_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/heads/${branch}" -f "sha=${base_sha}" >/dev/null
          encoded_marker="$(printf '%s\n' "$marker" | base64 | tr -d '\n')"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${marker_path}" \
            -f message='test: record issue-comment token control' \
            -f "content=${encoded_marker}" -f "branch=${branch}" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/contents/${marker_path}?ref=${branch}" \
            --jq '"MARKER_SHA=" + .sha'
          echo 'CONTROL_TOKEN_WRITE=branch+marker'
